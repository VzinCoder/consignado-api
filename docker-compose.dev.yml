# Somente as dependências de desenvolvimento. Os apps rodam na máquina com `pnpm dev`.
name: zelafin-dev

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zelafin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zelafin}
      POSTGRES_DB: ${POSTGRES_DB:-zelafin}
    ports:
      - '5432:5432'
    volumes:
      - zelafin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zelafin-pgdata:
